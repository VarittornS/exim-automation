name: QA Automation CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      qa-api:
        image: rvancea/qa-practice-api:latest
        ports:
          - 8887:8081

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Run Tests with Maven
      run: mvn clean test -f qa-automation-test/pom.xml

    - name: Upload Report
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: cucumber-report
        path: qa-automation-test/target/cucumber-reports.html